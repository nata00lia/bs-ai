<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.S AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
  body{display:flex;height:100vh;background:#0f0f0f;color:#fff;overflow:hidden}
  .sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:14px;flex-shrink:0}
  .sidebar h2{font-size:20px;margin-bottom:12px}
  .new-btn{background:#fff;color:#000;border:none;padding:10px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:12px;width:100%}
  .history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .hist-item{padding:10px;border-radius:8px;cursor:pointer;background:#222;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center}
  .hist-item.active{background:#333}
  .hist-item span{flex:1;overflow:hidden;text-overflow:ellipsis}
  .del{color:#ff5555;background:none;border:none;cursor:pointer;margin-left:6px}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{padding:14px 20px;border-bottom:1px solid #222;font-weight:700;font-size:18px}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:85%;padding:12px 14px;border-radius:14px;line-height:1.5;font-size:15px;word-wrap:break-word}
  .msg.user{background:#2a2a2a;align-self:flex-end}
  .msg.ai{background:#1c1c1c;align-self:flex-start;width:100%;max-width:100%}
  .msg.ai img{width:100%;border-radius:12px;margin-top:8px;max-width:600px;display:block}
  .copy-msg{background:#333;color:#fff;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;margin-top:8px}
  .input-area{display:flex;gap:8px;padding:14px;background:#171717;align-items:center}
  .input-area input[type=text]{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;outline:none;font-size:15px}
  .icon-btn{background:#333;color:#fff;border:none;width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:20px;flex-shrink:0}
  .send-btn{background:#fff;color:#000;border:none;padding:0 18px;height:44px;border-radius:12px;cursor:pointer;font-weight:700}
  @media(max-width:700px){.sidebar{display:none}}
</style>
</head>
<body>
<div class="sidebar">
  <h2>B.S AI</h2>
  <button class="new-btn" onclick="newChat()">+ New Chat</button>
  <div class="history" id="history"></div>
</div>

<div class="main">
  <div class="top">B.S AI - Ask Anything</div>
  <div id="chat"></div>
  <div class="input-area">
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)">
    <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload image">📷</button>
    <input type="text" id="input" placeholder="Ask B.S AI anything... try: generate a tree diagram" onkeydown="if(event.key==='Enter') send()">
    <button class="send-btn" onclick="send()">Send</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem('bs_chats') || '[]');
let currentId = null;
let pendingImage = null;

function save(){ localStorage.setItem('bs_chats', JSON.stringify(chats)); renderHistory(); }
function newChat(){
  const id = Date.now().toString();
  chats.unshift({ id, title:'New Chat', messages:[] });
  currentId = id; save(); renderChat();
}
function renderHistory(){
  const h = document.getElementById('history');
  h.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'hist-item' + (c.id===currentId?' active':'');
    d.innerHTML = `<span>${c.title}</span><button class="del" onclick="deleteChat(event,'${c.id}')">x</button>`;
    d.onclick = () => { currentId = c.id; renderHistory(); renderChat(); };
    h.appendChild(d);
  });
}
function deleteChat(e,id){
  e.stopPropagation();
  chats = chats.filter(c=>c.id!==id);
  if(currentId===id){ currentId = chats[0]?.id || null; }
  save(); renderChat();
}
function renderChat(){
  const box = document.getElementById('chat');
  box.innerHTML = '';
  const chat = chats.find(c=>c.id===currentId);
  if(!chat){ box.innerHTML = '<div class="msg ai">Hello! I am B.S AI. Ask me anything, upload a photo, or say "generate a tree diagram" and I will draw it for you.</div>'; return; }
  chat.messages.forEach(m => addMsgToUI(m.role, m.content, false));
}
function addMsgToUI(role, content, scroll=true){
  const box = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  if(content.startsWith('[IMAGE] ')){
    const url = content.replace('[IMAGE] ','');
    div.innerHTML = `<img src="${url}"><br><button class="copy-msg" onclick="window.open('${url}')">📥 Download</button>`;
  } else if(content.startsWith('data:image')){
    div.innerHTML = `<img src="${content}">`;
  } else {
    div.innerHTML = content.replace(/\n/g,'<br>') + (role==='assistant' ? `<br><button class="copy-msg" onclick="copyText(this)">📋 Copy</button>` : '');
  }
  box.appendChild(div);
  if(scroll) box.scrollTop = box.scrollHeight;
  return div;
}
function copyText(btn){
  const text = btn.parentElement.innerText.replace('📋 Copy','');
  navigator.clipboard.writeText(text);
  btn.textContent = '✅ Copied!';
  setTimeout(()=>btn.textContent='📋 Copy',1500);
}
function handleImage(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = reader.result;
    if(!currentId) newChat();
    const chat = chats.find(c=>c.id===currentId);
    chat.messages.push({role:'user', content: pendingImage});
    addMsgToUI('user', pendingImage);
    sendImageQuestion();
  };
  reader.readAsDataURL(file);
  input.value = '';
}
async function sendImageQuestion(){
  const box = document.getElementById('chat');
  const thinking = document.createElement('div');
  thinking.className='msg ai'; thinking.textContent='Looking at your image... 👀';
  box.appendChild(thinking);
  // For now, describe that image was received - Groq text model will explain via chat
  thinking.textContent = 'I can see your image. What do you want me to explain about it?';
  save();
}

async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;

  // --- IMAGE GENERATION: triggers for ANY generate/draw/create ---
  const lower = text.toLowerCase();
  if(lower.includes('generate') || lower.includes('draw') || lower.includes('create') || lower.includes('make a picture') || lower.includes('make an image') || lower.includes('make a diagram')){
    if(!currentId) newChat();
    const chat = chats.find(c=>c.id===currentId);
    if(chat.title==='New Chat') chat.title = text.slice(0,30);
    chat.messages.push({role:'user', content:text});
    addMsgToUI('user', text);
    input.value = '';

    const thinking = addMsgToUI('assistant', 'Drawing your image... 🎨 Please wait...');
    try{
      const res = await fetch('/generate-image', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ prompt: text })
      });
      const data = await res.json();
      thinking.remove();
      addMsgToUI('assistant', '[IMAGE] ' + data.imageUrl);
      chat.messages.push({role:'assistant', content: '[IMAGE] ' + data.imageUrl});
      save();
    }catch(e){
      thinking.textContent = 'Failed to generate image. Try again.';
    }
    return;
  }

  // --- NORMAL CHAT ---
  if(!currentId) newChat();
  const chat = chats.find(c=>c.id===currentId);
  if(chat.title==='New Chat') chat.title = text.slice(0,30);
  chat.messages.push({role:'user', content:text});
  addMsgToUI('user', text);
  input.value = '';

  const thinking = addMsgToUI('assistant', 'Thinking...');
  try{
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: chat.messages.filter(m=>!m.content.startsWith('data:image') && !m.content.startsWith('[IMAGE]')).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    thinking.remove();
    const reply = data.reply || data.error || 'No reply';
    addMsgToUI('assistant', reply);
    chat.messages.push({role:'assistant', content: reply});
    save();
  }catch(e){
    thinking.textContent = 'Error: ' + e.message;
  }
}

if(chats.length===0) newChat();
else { currentId = chats[0].id; renderHistory(); renderChat(); }
renderHistory();
</script>
</body>
</html>
